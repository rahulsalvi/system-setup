---
- name: Set /etc/kernel/cmdline
  ansible.builtin.copy:
    src: "{{ uki_root_disk_mode }}/cmdline"
    dest: /etc/kernel/cmdline
    owner: root
    group: root
    mode: u=rw,g=r,o=r
  become: true
  notify: "Regenerate initramfs"

- name: Set /etc/crypttab
  ansible.builtin.copy:
    src: "{{ uki_root_disk_mode }}/crypttab"
    dest: /etc/crypttab
    owner: root
    group: root
    mode: u=rw
  become: true
  notify: "Regenerate initramfs"

- name: Remove deprecated /etc/crypttab.initramfs
  ansible.builtin.file:
    path: /etc/crypttab.initramfs
    state: absent
  become: true

- name: Use systemd mkinitcpio hooks
  ansible.builtin.copy:
    src: mkinitcpio-hooks.conf
    dest: /etc/mkinitcpio.conf.d/50-systemd-hooks.conf
    owner: root
    group: root
    mode: u=rw,g=r,o=r
  become: true
  notify: "Regenerate initramfs"
